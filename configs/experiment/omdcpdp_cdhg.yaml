# @package _global_

# Inherit from default experiment configs
defaults:
  - override /model: parco.yaml
  - override /env: omdcpdp.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: null # set to wandb.yaml or tensorboard.yaml if needed

env:
  generator_params:
    num_loc: 100
    num_agents: 50

# Model hyperparameters with Conflict-Driven Hypergraph (CD-HG v2.1) + FMCR
model:
  policy:
    _target_: "parco.models.policy.PARCOPolicy"
    env_name: "${env.name}"
    agent_handler: "highprob"
    embed_dim: 128
    norm_after: false
    normalization: "rms"
    use_final_norm: false
    parallel_gated_kwargs:
      mlp_activation: "silu"
    context_embedding_kwargs:
      normalization: "rms"
      norm_after: false
      use_final_norm: false
      parallel_gated_kwargs:
        mlp_activation: "silu"
      hscl_config:
        use_hscl: true
        version: "v2"
        num_prototypes: 8
        tau: 1.0
        topk: 2
        use_gate: true                 # Flag: Gated residual h_flat + tanh(g)*(h_hg - h)
        topk_method: "ste"             # Flag: 'ste' (Straight-Through) or 'hard'
        use_prototype_mask: true       # Flag: mask out empty prototypes (sum H < eps) in MHA
        use_spatial_prior: true        # Flag: spatial distance prior beta_t * pi_ik
        beta_prior: 1.0                # Initial weight of geographic prior
  lambda_int: 0.1                      # Flag: Intent overlap loss weight
  lambda_col: 0.1                      # Flag: Realized collision loss weight
  lambda_bal: 0.01                     # Flag: Load balancing loss weight
  lambda_sp: 0.01                      # Flag: Sparsity loss weight
  warmup_ratio: 0.1                    # Flag: Linear warmup for losses & decay for beta
  batch_size: 128
  val_batch_size: ${model.batch_size}
  test_batch_size: ${model.batch_size}
  train_data_size: 100_000
  val_data_size: 10_000
  test_data_size: 10_000
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 0.0
  lr_scheduler: "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [80, 95]
    gamma: 0.1
  num_augment: 8
  train_min_agents: 10
  train_max_agents: ${env.generator_params.num_agents}
  train_min_size: 50
  train_max_size: ${env.generator_params.num_loc}

logger:
  wandb:
    project: "parco-${env.name}"
    tags: ["parco", "${env.name}", "cdhg", "fmcr"]
    group: "${env.name}_n${env.generator_params.num_loc}_m${env.generator_params.num_agents}"
    name: "cdhg-fmcr"

trainer:
  max_epochs: 100
  devices: 1
  strategy: "auto"

seed: 1234

callbacks:
  model_checkpoint:
    monitor: "val/reward/n100_m20"
